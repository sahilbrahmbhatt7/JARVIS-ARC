<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>

    <!--BootStrap-->
    <link rel="stylesheet" href="bootstrapcss/css/bootstrap.min.css">

    <!--BootStrap Icon-->
    <link rel="stylesheet" href="bootstrap-icons-1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

    <!--particales from particale.js website-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
        type="text/javascript"></script>

    <!--Source: Texllate-->
    <link rel="stylesheet" href="./assets/vendore/texllate/animate.css">

    <!--Logo-->
    <link rel="shortcut icon" href="./assets/vendore/img/logo.ico" type="image/x-icon">

    <!-- startup Animation -->
    <link rel="stylesheet" href="boot.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">


</head>

<body>
    <!-- ================= BOOT SCREEN ================= -->

    <div id="boot">

        <svg viewBox="0 0 200 200">

            <circle cx="100" cy="100" r="80" class="boot-circle"></circle>

            <polygon points="100,5 195,100 100,195 5,100" class="boot-diamond"></polygon>

            <text x="100" y="95" class="boot-text boot-prime">PRIME</text>
            <text x="100" y="115" class="boot-text boot-enterprise">ENTERPRISE</text>

        </svg>

    </div>

    <!-- =============================================== -->
    <div class="conatiner" style="opacity:0; transition:opacity 1.5s;">


        <section id="Ovel" class="mb-4">
            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div class="d-flex justify-content-center align-items-center" style="height: 80vh;">

                        <!-- <canvas id="canvasOne" width="700" height="420" style="position: absolute;"></canvas> -->

                        <div id="JarvisHood">
                            <div class="square">
                                <span class="circle"></span>
                                <h4 class="text-light">J.A.R.V.I.S</h4>
                                <span class="circle"></span>
                                <span class="circle"></span>
                            </div>
                        </div>
                    </div>

                    <h5 class="text-light text text-center">Ask Me anything</h5>

                    <div class="col-md-12 mt-4 pt-4">
                        <div class="text-center">
                            <div id="TextInput" class="d-flex">

                                <input type="text" class="input-field" name="chatbox" id="chatbox"
                                    placeholder="type here...">
                                <button id="SendBtn" class="glow-on-hover" hidden><i class="bi bi-send"></i></button>
                                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas"
                                    data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"><i
                                        class="bi bi-chat-dots"></i></button>
                                <button id="SettingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>

                            </div>
                        </div>
                    </div>

                </div>
                <div class="col-md-1"></div>

            </div>
        </section>

        <section id="SiriWave" class="mb-4">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height: 90vh;">
                            <div class="">
                                <p class="text-start text-light mb-4 siri-message" style="font-size: 28px;">Hello, I am J.A.R.V.I.S </p>
                                <div id="siri-container"></div>
                                <button id="StopBtn" class="glow-on-hover" style="margin-left:50% ;"><i
                                        class="bi bi-stop-fill"></i></button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= SETTINGS SECTION ================= -->

        <section id="Settings" class="mb-4" hidden>
            <div class="container mt-5 p-4 rounded shadow-lg settings-panel position-relative">


                <button id="sclose" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"></button>

                <h3 class="text-center settingHead mb-4">Assistant Command Settings</h3>


                <ul class="nav nav-tabs mb-4" id="commandTabs" role="tablist">
                    <!-- System Command -->
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="system-tab" data-bs-toggle="tab"
                            data-bs-target="#systemCommand" type="button" role="tab" aria-controls="systemCommand"
                            aria-selected="true">
                            System Command
                        </button>
                    </li>
                    <!-- Web Command -->
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="web-tab" data-bs-toggle="tab" data-bs-target="#webCommand"
                            type="button" role="tab" aria-controls="webCommand" aria-selected="false">
                            Web Command
                        </button>
                    </li>
                    <!-- video Command -->
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#videoCommand"
                            type="button" role="tab" aria-controls="videoCommand" aria-selected="false">
                            Other Command
                        </button>
                    </li>
                    <!-- contect Command -->
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                            data-bs-target="#contactCommand" type="button" role="tab"
                            aria-controls="contactCommand" aria-selected="false">
                            Contact Command
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="commandTabsContent">
                    <!-- System Command -->
                    <div class="tab-pane fade show active" id="systemCommand" role="tabpanel"
                        aria-labelledby="system-tab">
                        <div class="row g-2 mb-3">
                            <div class="col-md-5">
                                <input id="sys-key" type="text" class="form-control input-dark"
                                    placeholder="Keyword e.g. notepad">
                            </div>
                            <div class="col-md-5">
                                <input id="sys-path" type="text" class="form-control input-dark"
                                    placeholder="Path e.g. C:/Windows/notepad.exe">
                            </div>
                            <div class="col-md-2">
                                <button id="addSysData" class="glow-on-hover w-100">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>

                        <table class="table table-dark table-bordered">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Keyword</th>
                                    <th>Path</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="systemSettingsTable"></tbody>
                        </table>
                    </div>
                    <!-- Web Command -->
                    <div class="tab-pane fade" id="webCommand" role="tabpanel" aria-labelledby="web-tab">
                        <div class="row g-2 mb-3">
                            <div class="col-md-5">
                                <input id="web-key" type="text" class="form-control input-dark"
                                    placeholder="Keyword e.g. Google">
                            </div>
                            <div class="col-md-5">
                                <input id="web-url" type="text" class="form-control input-dark"
                                    placeholder="URL e.g. https://www.google.com">
                            </div>
                            <div class="col-md-2">
                                <button id="addWebData" class="glow-on-hover w-100">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>

                        <table class="table table-dark table-bordered">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Keyword</th>
                                    <th>URL</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="webSettingsTable"></tbody>
                        </table>
                    </div>
                    <!-- Video Command -->
                    <div class="tab-pane fade" id="videoCommand" role="tabpanel" aria-labelledby="video-tab">

                        <div class="row g-2 mb-3">
                            <div class="col-md-5">
                                <input id="video-key" type="text" class="form-control input-dark"
                                    placeholder="Keyword e.g. play movie">
                            </div>
                            <div class="col-md-5">
                                <input id="video-path" type="text" class="form-control input-dark"
                                    placeholder="Video Path e.g. C:/Users/YUG/Videos/movie.mp4">
                            </div>
                            <div class="col-md-2">
                                <button id="addVideoData" class="glow-on-hover w-100">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>

                        <table class="table table-dark table-bordered">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Keyword</th>
                                    <th>Video Path</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="videoSettingsTable"></tbody>
                        </table>
                    </div>
                    <!-- Contact Command -->
                    <div class="tab-pane fade" id="contactCommand" role="tabpanel" aria-labelledby="contact-tab">
                        <!-- Add Single Contact -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <input id="contact-name" type="text" class="form-control input-dark"
                                    placeholder="Contact Name">
                            </div>

                            <div class="col-md-4 d-flex">
                                <span class="input-group-text bg-dark text-white border-0">+91</span>
                                <input id="contact-number" type="text" maxlength="10"
                                    class="form-control input-dark"
                                    placeholder="Enter 10 digit number">
                            </div>

                            <div class="col-md-2">
                                <button id="addContactData" class="glow-on-hover w-100">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- CSV Upload -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <input type="file" id="contactCsvUpload"
                                    class="form-control input-dark"
                                    accept=".csv">
                            </div>
                            <div class="col-md-3">
                                <button id="uploadCsvBtn" class="glow-on-hover w-100">
                                    Upload CSV
                                </button>
                            </div>
                        </div>

                        <!-- Contact Table -->
                        <table class="table table-dark table-bordered">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Phone (+91)</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="contactSettingsTable"></tbody>
                        </table>

                    </div>
                </div>

            </div>
        </section>

        <!-- =================================================== -->

    </div>


    <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
        id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white" id="offcanvasScrollingLabel">Chats</h5>
            <button type="button" class="btn-close text-reset btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div id="chat-canvas-body" class="offcanvas-body">
            <!-- Chatting code here -->

        </div>
    </div>



    <!--Jquery  -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <!-- bootstrap -->
    <script src="bootstrapjs/js/bootstrap.bundle.js"></script>

    <!--particle-->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src='https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js'></script>
    <script src="./script.js"></script>

    <!--Jarvis Wave-->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <!--TextAnimation js-->
    <script src="./assets/vendore/texllate/jquery.fittext.js"></script>
    <script src="./assets/vendore/texllate/jquery.lettering.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

    <!--link of Frontend and backend-->
    <script src="/eel.js"></script>
    <script src="./controller.js"></script>

    <!-- boot screen js -->
    <script src="./boot.js"></script>

    <!--Main.js-->
    <script src="./main.js"></script>
</body>

</html>
